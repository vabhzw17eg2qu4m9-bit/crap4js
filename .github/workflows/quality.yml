name: Quality

on: [push, pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Test with coverage
        # Run the tests AND emit coverage/coverage-final.json (the Istanbul
        # JSON the tool reads) plus a text summary. The package.json "test"
        # script stays `node --test` for local use; c8 is invoked explicitly
        # here so devDependencies stay lean.
        run: npx c8 --reporter=json --reporter=text --include='src/**/*.js' node --test
      - name: Self-analyze (crap4js on its own source)
        # Self-hosting: the tool computes CRAP for its own .js files against
        # the real coverage just generated. Hard 8.0 gate — reports genuine
        # per-method Cov% and Max CRAP. Mirrors the crap4py CI self-analysis.
        run: node src/cli.js --coverage coverage/coverage-final.json
      - name: Refresh CRAP + coverage badges
        # Self-hosting: derive both badge values from the real coverage just
        # generated above, then commit the refreshed SVGs back.
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          cov=$(node -e "const c=require('./coverage/coverage-final.json');let t=0,h=0;for(const f in c){const s=c[f].s||{};for(const k in s){t++;if(s[k]>0)h++;}}console.log(t?(100*h/t).toFixed(1):'0.0')")
          if [ -z "$cov" ]; then
            cov_val="N/A"; cov_color="#9f9f9f"
          else
            cov_val=$(awk -v c="$cov" 'BEGIN { printf "%.1f%%", c }')
            cov_color=$(awk -v c="$cov" 'BEGIN {
              if (c < 60)      print "#e05d44";
              else if (c < 70) print "#fe7d37";
              else if (c < 80) print "#dfb317";
              else if (c < 90) print "#a4a61d";
              else             print "#4c1";
            }')
          fi

          set +e
          crap_out=$(node src/cli.js --coverage coverage/coverage-final.json 2>&1)
          set -e
          max=$(printf '%s\n' "$crap_out" | awk -F': ' '/^Max CRAP:/ {split($2, a, " "); print a[1]}')
          if [ -z "$max" ]; then
            max_val="N/A"; crap_color="#9f9f9f"
          else
            max_val=$(awk -v m="$max" 'BEGIN { printf "%.2f", m }')
            crap_color=$(awk -v m="$max" 'BEGIN {
              if (m <= 8.0)      print "#4c1";
              else if (m <= 16.0) print "#dfb317";
              else                print "#e05d44";
            }')
          fi

          mkdir -p badges
          node scripts/badge.mjs CRAP "$max_val" "$crap_color" badges/crap.svg
          node scripts/badge.mjs coverage "$cov_val" "$cov_color" badges/coverage.svg
          echo "max=$max_val color=$crap_color | cov=$cov_val color=$cov_color"
      - name: Commit refreshed badges
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges/crap.svg badges/coverage.svg
          if git diff --cached --quiet; then
            echo "badges unchanged"
          else
            git commit -m "chore: refresh CRAP/coverage badges"
            git push
          fi
